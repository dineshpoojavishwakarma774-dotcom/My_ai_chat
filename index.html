<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Chat</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:16px;background:#1e293b;text-align:center;font-weight:bold;font-size:20px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px}
.user{align-self:flex-end;background:#2563eb}
.ai{align-self:flex-start;background:#1e293b;border:1px solid #334155}
#inputArea{display:flex;padding:12px;background:#1e293b;gap:8px}
input{flex:1;padding:14px;border-radius:24px;border:none;outline:none;background:#0f172a;color:#fff;border:1px solid #334155}
button{padding:12px 20px;border-radius:24px;border:none;background:#2563eb;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header>🤖 My AI Chat</header>
<div id="chat"><div class="msg ai">Namaste! Main aapka AI assistant hu.</div></div>
<div id="inputArea">
<input id="input" placeholder="Kuch likho..." />
<button onclick="send()">Send</button>
</div>
<script>
function send(){
 const i=document.getElementById('input'); const c=document.getElementById('chat');
 if(!i.value) return;
 c.innerHTML+=`<div class=msg user>${i.value}</div>`;
 c.innerHTML+=`<div class=msg ai>Demo reply: ${i.value}</div>`;
 i.value=''; c.scrollTop=c.scrollHeight;
}
</script>
</body>
</html>
