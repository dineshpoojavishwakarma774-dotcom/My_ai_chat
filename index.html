<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My AI Chat</title>
<script src="https://js.puter.com/v2/"></script>
<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:#fff;display:flex;flex-direction:column;height:100vh}
header{padding:16px;background:#1e293b;text-align:center;font-weight:bold}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:16px}
.user{align-self:flex-end;background:#2563eb}
.ai{align-self:flex-start;background:#334155}
#box{display:flex;padding:10px;background:#1e293b;gap:6px}
input{flex:1;padding:12px;border-radius:20px;border:none}
button{padding:10px 18px;border-radius:20px;border:none;background:#2563eb;color:#fff}
</style>
</head>
<body>
<header>My AI Chat - Real AI</header>
<div id="chat"><div class="msg ai">Namaste! Kuch bhi pucho.</div></div>
<div id="box"><input id="inp" placeholder="Likho..."><button onclick="go()">Send</button></div>
<script>
async function go(){
let i=document.getElementById('inp');
let c=document.getElementById('chat');
let t=i.value; if(!t) return;
c.innerHTML+=`<div class=msg user>${t}</div>`;
i.value=''; let d=document.createElement('div');
d.className='msg ai'; d.innerText='Soch raha hu...'; c.appendChild(d);
c.scrollTop=c.scrollHeight;
try{
let r=await puter.ai.chat(t);
d.innerText=r;
}catch(e){d.innerText='Error: '+e.message}
}
</script>
</body>

</html>
